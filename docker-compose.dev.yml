name: cartspace

services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    container_name: cartspace-api
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"
    env_file:
      - .env.local
    volumes:
      - ./apps/api:/app
      - /app/tmp
    networks:
      - app-network
    healthcheck:
      test:
        ["CMD", "wget", "--spider", "-q", "http://localhost:5000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      # first start compiles the api with air, so allow time and poll fast meanwhile
      start_period: 120s
      start_interval: 2s

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile.dev
    container_name: cartspace-web
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      NEXT_DIST_DIR: .next-docker
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
      - ./turbo.json:/app/turbo.json
      - /app/apps/web/node_modules
      - /app/apps/web/.next-docker
    networks:
      - app-network

  db:
    image: postgres:17-alpine
    container_name: cartspace-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:5432:5432"
    env_file:
      - .env.local
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network

  # Catches every email the api sends (SMTP mailpit:1025); read them at
  # http://localhost:8025. Nothing leaves the machine.
  mailpit:
    image: axllent/mailpit:v1.31.3
    container_name: cartspace-mailpit
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  pgdata:
